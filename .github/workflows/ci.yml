name: CI

permissions:
  contents: read

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".eslintrc.json"
      - ".flake8"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".eslintrc.json"
      - ".flake8"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: python -m flake8 backend

      - name: black --check
        run: python -m black backend --exclude venv --check

      - name: mypy
        # Non-blocking: 77 pre-existing findings (mostly SQLAlchemy nullable
        # columns used without a None check) need reviewing incrementally,
        # not fixed as a drive-by. Remove continue-on-error once clean.
        continue-on-error: true
        run: python -m mypy backend

      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test
